# XcodeGen spec for the iPhone app (xcodegen generate). The Kotlin side is ReadAlongKit.framework, linked by
# ./gradlew -p ios-app linkReleaseFrameworkIosArm64 before Xcode builds (see .github/workflows/ios.yml).
name: ReadAlong
options:
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    MARKETING_VERSION: ${READALONG_VERSION}
    CURRENT_PROJECT_VERSION: "1"
targets:
  ReadAlong:
    type: application
    platform: iOS
    sources:
      - Sources
      # Fonts, icons and the version file, which the Kotlin side reads from the bundle (AppPaths.resource).
      - path: ../build/bundle-resources/fonts
        type: folder
        buildPhase: resources
      - path: ../build/bundle-resources/icons
        type: folder
        buildPhase: resources
      - path: ../build/bundle-resources/icon
        type: folder
        buildPhase: resources
      - path: ../build/bundle-resources/readalong-version.txt
        buildPhase: resources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: ReadAlong
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIBackgroundModes: [audio]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        CADisableMinimumFrameDurationOnPhone: true
        NSLocalNetworkUsageDescription: ReadAlong finds your computer on Wi-Fi to sync books and transcripts.
        NSBonjourServices: [_readalong._tcp]
        NSCameraUsageDescription: ReadAlong scans the code your computer shows to link the two.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.lukeherc-cpu.readalong
        TARGETED_DEVICE_FAMILY: "1,2"
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../build/bin/iosArm64/releaseFramework
        # whisper.cpp (built by the workflow from Whisper/CMakeLists.txt) and the system libraries the Kotlin side uses.
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/../build/whisper-ios
        SWIFT_OBJC_BRIDGING_HEADER: Sources/BridgingHeader.h
        OTHER_LDFLAGS: [-framework, ReadAlongKit, -lsqlite3, -lz, -lc++, -lreadalong_whisper_all,
          -framework, Metal, -framework, MetalKit, -framework, Accelerate, -framework, AVFoundation, -framework, MediaPlayer,
          -framework, WebKit, -framework, Security, -framework, CoreMedia, -framework, AudioToolbox, -framework, QuartzCore,
          -framework, CoreGraphics, -framework, CoreText, -framework, UniformTypeIdentifiers]
        ENABLE_BITCODE: NO
        CODE_SIGNING_ALLOWED: NO
