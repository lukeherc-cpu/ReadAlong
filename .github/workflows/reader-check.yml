name: Reader check (emulator)

# Runs the live-sync reader tests on an emulator. Manual, or on pushes to fix/** branches.
on:
  push:
    branches: ["fix/**"]
  workflow_dispatch:
    inputs:
      tests:
        description: "Instrumentation class (or class#method)"
        default: "com.example.readalong.LiveSyncScrollTest"

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - uses: gradle/actions/setup-gradle@v4

      - name: Build app and tests
        run: ./gradlew --no-configuration-cache assembleGithubDebug assembleGithubDebugAndroidTest

      # The Whistle runtime is arm64 only; Android 11+ x86_64 images run it through ARM translation.
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb install -r -g app/build/outputs/apk/github/debug/app-github-debug.apk
            adb install -r -g app/build/outputs/apk/androidTest/github/debug/app-github-debug-androidTest.apk
            adb shell am instrument -w -r -e class "${{ github.event.inputs.tests || 'com.example.readalong.LiveSyncScrollTest' }}" com.example.readalong.test/androidx.test.runner.AndroidJUnitRunner | tee instrument.txt
            mkdir -p verification; adb pull /sdcard/Android/data/com.example.readalong/files/. verification/ || true
            adb logcat -d -s LiveSyncScrollTest:I ReadAlong:* AndroidRuntime:E > verification/logcat.txt || true
            ! grep -q "FAILURES!!!\|INSTRUMENTATION_FAILED\|Process crashed" instrument.txt

      - name: Keep results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reader-check
          path: |
            instrument.txt
            verification/
