name: Play compile check

# Compiles both flavors' Kotlin so a change to the shared code or the Play-only sources can't break the
# other build. Uploads nothing: Play builds are never published from this public repository.
on:
  pull_request:
    paths: ["app/**", "gradle/**", "*.gradle.kts", ".github/workflows/play-check.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Accept SDK licenses
        run: |
          sdkmanager="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin | sort -V | tail -1)/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile
        run: ./gradlew --no-configuration-cache :app:compilePlayReleaseKotlin :app:compileGithubReleaseKotlin :app:compilePlayDebugAndroidTestKotlin
