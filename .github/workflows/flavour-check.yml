name: Flavour check (temporary)
# Lives only on fix/release-check-* branches: compiles both flavours and runs every unit test before a release.
on:
  push:
    branches: ["fix/release-check-*"]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, both flavours
        run: ./gradlew --no-configuration-cache --continue testGithubDebugUnitTest testPlayDebugUnitTest
      - name: Build both flavours (release) and the test APK
        run: ./gradlew --no-configuration-cache --continue assembleGithubRelease assemblePlayRelease assembleGithubDebugAndroidTest
