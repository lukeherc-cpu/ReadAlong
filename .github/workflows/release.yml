name: Release APK

# Push a branch named release/<anything> to build, sign and publish the version in
# app/build.gradle.kts as tag v<versionName>. Versions ending in -preview are pre-releases.
on:
  push:
    branches: ["release/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # The runner already has an Android SDK; add what this app needs on top.
      - name: Install SDK packages
        run: |
          sdkmanager="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin | sort -V | tail -1)/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null || true
          # Gradle downloads the platform, NDK and CMake versions the build asks for.
          "$sdkmanager" --list | grep -E "platforms;android-37|ndk;28|cmake;3.22" || true

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-configuration-cache testGithubDebugUnitTest

      - name: Build
        run: ./gradlew --no-configuration-cache assembleGithubRelease

      - name: Sign
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/debug.keystore"
          version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          unsigned=$(ls app/build/outputs/apk/github/release/*.apk | head -1)
          "$tools/zipalign" -f -p 4 "$unsigned" aligned.apk
          "$tools/apksigner" sign --ks "$RUNNER_TEMP/debug.keystore" --ks-pass pass:android \
            --ks-key-alias androiddebugkey --key-pass pass:android --out "ReadAlong-$version.apk" aligned.apk
          "$tools/apksigner" verify --print-certs "ReadAlong-$version.apk" | grep -i "SHA-256"
          sha256sum "ReadAlong-$version.apk" > "ReadAlong-$version.apk.sha256"
          rm "$RUNNER_TEMP/debug.keystore"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Publish release
        if: startsWith(github.ref, 'refs/heads/release/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: ReadAlong ${{ env.VERSION }}
          prerelease: ${{ contains(env.VERSION, 'preview') }}
          make_latest: ${{ !contains(env.VERSION, 'preview') }}
          generate_release_notes: true
          files: |
            ReadAlong-${{ env.VERSION }}.apk
            ReadAlong-${{ env.VERSION }}.apk.sha256

      - name: Keep the APK (manual runs)
        if: "!startsWith(github.ref, 'refs/heads/release/')"
        uses: actions/upload-artifact@v4
        with:
          name: ReadAlong-${{ env.VERSION }}
          path: ReadAlong-${{ env.VERSION }}.apk*
