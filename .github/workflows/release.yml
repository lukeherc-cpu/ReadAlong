name: Release APK

# Push a branch named release/<anything> to build, sign and publish the version in
# app/build.gradle.kts as tag v<versionName>. Versions ending in -preview are pre-releases.
#
# The release starts as a draft holding the APK. The Windows, Linux and macOS jobs add their installers to it,
# and only then is it published. The apps' update checks read GitHub's "latest" release, so nobody is offered
# a version whose installer for their computer doesn't exist yet. If a desktop job fails, the release stays a
# draft: re-run the failed job and "Publish the release" runs after it.
on:
  push:
    branches: ["release/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # The runner already has an Android SDK; add what this app needs on top.
      - name: Install SDK packages
        run: |
          sdkmanager="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin | sort -V | tail -1)/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null || true
          # Gradle downloads the platform, NDK and CMake versions the build asks for.
          "$sdkmanager" --list | grep -E "platforms;android-37|ndk;28|cmake;3.22" || true

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-configuration-cache testGithubDebugUnitTest

      - name: Build
        run: ./gradlew --no-configuration-cache assembleGithubRelease

      - name: Sign
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/debug.keystore"
          version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          unsigned=$(ls app/build/outputs/apk/github/release/*.apk | head -1)
          "$tools/zipalign" -f -p 4 "$unsigned" aligned.apk
          "$tools/apksigner" sign --ks "$RUNNER_TEMP/debug.keystore" --ks-pass pass:android \
            --ks-key-alias androiddebugkey --key-pass pass:android --out "ReadAlong-$version.apk" aligned.apk
          "$tools/apksigner" verify --print-certs "ReadAlong-$version.apk" | grep -i "SHA-256"
          sha256sum "ReadAlong-$version.apk" > "ReadAlong-$version.apk.sha256"
          rm "$RUNNER_TEMP/debug.keystore"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Publish release
        if: startsWith(github.ref, 'refs/heads/release/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: ReadAlong ${{ env.VERSION }}
          draft: true
          prerelease: ${{ contains(env.VERSION, 'preview') }}
          generate_release_notes: true
          files: |
            ReadAlong-${{ env.VERSION }}.apk
            ReadAlong-${{ env.VERSION }}.apk.sha256

      - name: Keep the APK (manual runs)
        if: "!startsWith(github.ref, 'refs/heads/release/')"
        uses: actions/upload-artifact@v4
        with:
          name: ReadAlong-${{ env.VERSION }}
          path: ReadAlong-${{ env.VERSION }}.apk*

  windows:
    name: Windows installer
    needs: release
    if: startsWith(github.ref, 'refs/heads/release/')
    uses: ./.github/workflows/desktop-windows.yml
    with:
      release: true

  linux:
    name: Linux Flatpak
    needs: release
    if: startsWith(github.ref, 'refs/heads/release/')
    uses: ./.github/workflows/desktop-linux.yml
    with:
      release: true

  macos:
    name: macOS apps
    needs: release
    if: startsWith(github.ref, 'refs/heads/release/')
    uses: ./.github/workflows/desktop-macos.yml
    with:
      release: true

  publish:
    name: Publish the release
    needs: [release, windows, linux, macos]
    if: startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish once every installer is attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          gh release view "v$version" --json assets --jq '.assets[].name'
          for wanted in "ReadAlong-$version.apk" ReadAlong-Windows.msi ReadAlong-Windows-portable.zip ReadAlong-Linux.flatpak ReadAlong.flatpakref ReadAlong-Linux-x86_64.tar.gz ReadAlong-macOS-AppleSilicon.dmg ReadAlong-macOS-Intel.dmg; do
            gh release view "v$version" --json assets --jq '.assets[].name' | grep -qx "$wanted" || { echo "::error::$wanted is missing from the release"; exit 1; }
          done
          if [[ "$version" == *preview* ]]; then gh release edit "v$version" --draft=false --prerelease
          else gh release edit "v$version" --draft=false --latest; fi

      # Linux updates come from ReadAlong's Flatpak repository on GitHub Pages (gh-pages branch). It moves to the new
      # version only once the release is published, and never to a preview.
      - name: Download the Flatpak repository
        uses: actions/download-artifact@v4
        with:
          name: flatpak-site
          path: ${{ runner.temp }}/flatpak-site

      - name: Publish the Flatpak repository to GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if [[ "$version" == *preview* ]]; then echo "A preview doesn't go to the Flatpak repository."; exit 0; fi
          cd "$RUNNER_TEMP/flatpak-site"
          # One commit holding only the current repository, so the branch doesn't keep every old build.
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "ReadAlong $version Flatpak repository"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
