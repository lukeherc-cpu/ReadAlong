name: ReadAlong for macOS

# Builds the Mac app (desktop-app/) for Apple silicon and Intel: whisper.cpp with its Metal GPU backend, the
# Compose .app (ad-hoc signed, not notarized: there is no Apple Developer account) and a .dmg. It then
# transcribes synthesized speech with the packaged app on the CPU and, where the runner allows, on Metal.
on:
  push:
    paths: ["desktop-app/**", ".github/workflows/desktop-macos.yml", "app/src/main/java/com/example/readalong/domain/**", "app/src/github/java/com/example/readalong/audible/**"]
  workflow_dispatch:
  # release.yml calls this after publishing the APK, to add the disk images to the same release.
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false

permissions:
  contents: write

env:
  WHISPER_CPP_VERSION: v1.8.7

jobs:
  macos:
    name: macOS app (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            name: AppleSilicon
          - runner: macos-15-intel
            name: Intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4

      - name: Build whisper.cpp (Metal + CPU) and the JNI bridge
        run: |
          set -o pipefail
          mkdir -p ci-results
          git clone -q --depth 1 --branch "$WHISPER_CPP_VERSION" https://github.com/ggml-org/whisper.cpp ../whisper.cpp
          cmake -S desktop-app/native -B desktop-app/native/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            -DWHISPER_CPP="$(cd ../whisper.cpp && pwd)" 2>&1 | tee ci-results/native.log
          cmake --build desktop-app/native/build -j 4 2>&1 | tail -40 | tee -a ci-results/native.log
          ls -la desktop-app/native/build/resources/macos/whisper | tee -a ci-results/native.log
          for lib in desktop-app/native/build/resources/macos/whisper/*.dylib; do otool -L "$lib" | grep -v /usr/lib/ | grep -v /System/; done | tee -a ci-results/native.log

      - name: Build the app and disk image
        run: |
          set -o pipefail
          ./gradlew -p desktop-app --console=plain test createReleaseDistributable 2>&1 | tee ci-results/gradle.log
          app=desktop-app/build/compose/binaries/main-release/app/ReadAlong.app
          # No Developer ID: sign ad hoc so Apple silicon runs every library, then wrap it in a .dmg with a
          # shortcut to Applications. People open it once with Open Anyway (desktop-app/README.md).
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict "$app" 2>&1 | tee -a ci-results/gradle.log
          mkdir -p dmg dist
          cp -R "$app" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname ReadAlong -srcfolder dmg -ov -format UDZO "dist/ReadAlong-macOS-${{ matrix.name }}.dmg"
          ls -la dist | tee -a ci-results/gradle.log

      - name: Speech test with the packaged app (CPU)
        env:
          # Echo the transcriber process's own log, so a failure to start shows why.
          READALONG_VERBOSE: "1"
        run: |
          set -o pipefail
          mkdir -p "smoke/Test Book" models
          text="The quick brown fox jumps over the lazy dog. ReadAlong turns audiobooks into text you can read while you listen."
          say -o "smoke/Test Book/speech.wav" --file-format=WAVE --data-format=LEI16@22050 "$text $text $text"
          curl -sSL -o models/ggml-tiny.en.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.en.bin
          app=desktop-app/build/compose/binaries/main-release/app/ReadAlong.app/Contents/MacOS/ReadAlong
          "$app" --self-test "smoke/Test Book" --model models/ggml-tiny.en.bin --device cpu --expect fox --out ci-results/self-test-cpu.txt || true
          cat ci-results/self-test-cpu.txt
          grep -q "^PASS" ci-results/self-test-cpu.txt

      - name: Speech test on the GPU path (Metal)
        continue-on-error: true
        run: |
          set -o pipefail
          export READALONG_VERBOSE=1
          app=desktop-app/build/compose/binaries/main-release/app/ReadAlong.app/Contents/MacOS/ReadAlong
          "$app" --self-test "smoke/Test Book" --model models/ggml-tiny.en.bin --device gpu --expect fox --out ci-results/self-test-gpu.txt || true
          cat ci-results/self-test-gpu.txt
          grep -q "^PASS" ci-results/self-test-gpu.txt

      - name: Screenshots (macOS)
        if: always()
        continue-on-error: true
        run: |
          app=desktop-app/build/compose/binaries/main-release/app/ReadAlong.app/Contents/MacOS/ReadAlong
          "$app" --screenshots "$PWD/ci-results/screenshots-macos" || true
          ls ci-results/screenshots-macos || true

      - uses: actions/upload-artifact@v4
        with:
          name: ReadAlong-macOS-${{ matrix.name }}
          path: dist/*
          compression-level: 0

      - name: Add the disk image to the release
        if: inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -nE 's/.*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts | head -1)
          gh release upload "v$version" "dist/ReadAlong-macOS-${{ matrix.name }}.dmg" --clobber

      - name: Keep the results
        if: always()
        uses: ./.github/actions/ci-results
        with:
          job: macos-${{ matrix.name }}
