name: ReadAlong for Linux

# Builds the Linux app (desktop-app/): whisper.cpp with its Vulkan GPU backend and CPU variants, the Compose
# app image, a signed Flatpak repository with a .flatpakref and a bundle that update from it, and a portable tarball. It then transcribes synthesized speech with the
# packaged app and inside the installed Flatpak on the CPU, and on Mesa's software Vulkan (the runner has no GPU).
on:
  push:
    # A release branch is built once, by release.yml's call below, not a second time by its own push.
    branches-ignore: ["release/**"]
    paths: ["desktop-app/**", ".github/workflows/desktop-linux.yml", "app/src/main/java/com/example/readalong/domain/**", "app/src/audible/java/com/example/readalong/audible/**", "app/src/main/java/com/example/readalong/data/transcription/TimedRecognitionResult.kt", "app/src/main/java/com/example/readalong/data/transcription/WhistleResult.kt", "app/src/main/java/com/example/readalong/ui/reading/**", "app/src/main/java/com/example/readalong/ui/components/**", "app/src/main/java/com/example/readalong/ui/theme/Color.kt"]
  workflow_dispatch:
  # release.yml calls this after publishing the APK, to add the Flatpak to the same release.
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false

permissions:
  contents: write

env:
  WHISPER_CPP_VERSION: v1.8.7
  APP_ID: io.github.lukeherc_cpu.ReadAlong
  # ReadAlong's own Flatpak repository, published to GitHub Pages by release.yml. Bundles and the .flatpakref point
  # here, so `flatpak update` and software centres find each new release.
  FLATPAK_REPO_URL: https://lukeherc-cpu.github.io/ReadAlong/repo

jobs:
  linux:
    name: Linux Flatpak
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4

      - name: Install build and test tools
        run: |
          mkdir -p ci-results
          sudo apt-get update -q > /dev/null
          sudo apt-get install -y -q libvulkan-dev glslc spirv-headers espeak-ng mesa-vulkan-drivers flatpak flatpak-builder > /dev/null

      # whisper.cpp takes most of this job to compile and only changes with its version or native/.
      - name: Reuse the whisper.cpp build
        id: native
        uses: actions/cache@v4
        with:
          path: desktop-app/native/build
          key: native-linux-${{ env.WHISPER_CPP_VERSION }}-${{ hashFiles('desktop-app/native/**', '.github/workflows/desktop-linux.yml') }}

      - name: Build whisper.cpp (Vulkan + CPU) and the JNI bridge
        if: steps.native.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          git clone -q --depth 1 --branch "$WHISPER_CPP_VERSION" https://github.com/ggml-org/whisper.cpp ../whisper.cpp
          cmake -S desktop-app/native -B desktop-app/native/build -DCMAKE_BUILD_TYPE=Release -DWHISPER_CPP="$(cd ../whisper.cpp && pwd)" 2>&1 | tee ci-results/native.log
          cmake --build desktop-app/native/build -j 4 2>&1 | tail -40 | tee -a ci-results/native.log
          ls -la desktop-app/native/build/resources/linux/whisper | tee -a ci-results/native.log

      - name: Build the app and portable tarball
        run: |
          set -o pipefail
          ./gradlew -p desktop-app --console=plain createReleaseDistributable 2>&1 | tee ci-results/gradle.log
          mkdir -p dist
          tar -C desktop-app/build/compose/binaries/main-release/app -czf dist/ReadAlong-Linux-x86_64.tar.gz ReadAlong
          ls -la dist | tee -a ci-results/gradle.log

      - name: Build the Flatpak and its signed repository
        env:
          FLATPAK_GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
          RELEASE: ${{ inputs.release }}
        run: |
          set -o pipefail
          # Ubuntu 24.04 stops unprivileged user namespaces, which Flatpak's sandbox (bubblewrap) needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          # A release signs with the repository's key, which every installed copy trusts. Other runs sign with a
          # throwaway key, so the same steps are tested without the secret.
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 -p "$GNUPGHOME"
          if [ -n "$FLATPAK_GPG_PRIVATE_KEY" ]; then
            echo "$FLATPAK_GPG_PRIVATE_KEY" | gpg --batch --quiet --import
          elif [ "$RELEASE" = "true" ]; then
            echo "::error::The FLATPAK_GPG_PRIVATE_KEY secret is missing, so the release's Flatpak repository can't be signed."; exit 1
          else
            gpg --batch --quiet --passphrase '' --quick-gen-key "ReadAlong CI test key" rsa3072 sign never
          fi
          key=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ { print $10; exit }')
          gpg --export "$key" > ../flatpak-key.gpg
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak-builder --user --install-deps-from=flathub --disable-rofiles-fuse --force-clean \
            --gpg-sign="$key" --gpg-homedir="$GNUPGHOME" --repo=../flatpak-repo ../flatpak-build \
            "desktop-app/packaging/linux/$APP_ID.yml" 2>&1 | tail -60 | tee ci-results/flatpak.log
          flatpak build-update-repo --gpg-sign="$key" --gpg-homedir="$GNUPGHOME" --title=ReadAlong --prune ../flatpak-repo
          # --repo-url makes installing the bundle add ReadAlong's repository as its remote, so it updates like the rest.
          flatpak build-bundle --repo-url="$FLATPAK_REPO_URL" --gpg-keys=../flatpak-key.gpg \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo ../flatpak-repo dist/ReadAlong-Linux.flatpak "$APP_ID"
          desktop-app/packaging/linux/flatpak-site.sh ../flatpak-repo ../flatpak-key.gpg "$FLATPAK_REPO_URL" flatpak-site
          cp flatpak-site/ReadAlong.flatpakref dist/
          ls -la dist | tee -a ci-results/flatpak.log

      # Someone on an older bundle, which had no repository behind it, gets the new bundle from the update prompt.
      # Installing it over the old one must leave them on ReadAlong's repository.
      - name: Upgrade an installed older bundle with the new one
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          if gh release download --pattern ReadAlong-Linux.flatpak --dir ../previous 2>/dev/null; then
            flatpak install --user -y --noninteractive ../previous/ReadAlong-Linux.flatpak 2>&1 | tail -3
            flatpak install --user -y --noninteractive dist/ReadAlong-Linux.flatpak 2>&1 | tail -5 | tee ci-results/flatpak-upgrade.log
          else
            flatpak install --user -y --noninteractive dist/ReadAlong-Linux.flatpak 2>&1 | tail -5 | tee ci-results/flatpak-upgrade.log
          fi
          flatpak info --user "$APP_ID" | tee -a ci-results/flatpak-upgrade.log
          origin=$(flatpak info --user --show-origin "$APP_ID")
          flatpak remotes --user --show-details | tee -a ci-results/flatpak-upgrade.log
          flatpak remotes --user --columns=name,url | grep -E "^$origin\s" | grep -q "$FLATPAK_REPO_URL" \
            || { echo "::error::The installed bundle's remote ($origin) doesn't point at $FLATPAK_REPO_URL"; exit 1; }

      - name: Speech test with the packaged app (CPU)
        env:
          # Echo the transcriber process's own log, so a failure to start shows why.
          READALONG_VERBOSE: "1"
        run: |
          set -o pipefail
          mkdir -p "smoke/Test Book" models
          text="The quick brown fox jumps over the lazy dog. ReadAlong turns audiobooks into text you can read while you listen."
          espeak-ng -w "smoke/Test Book/speech.wav" "$text $text $text"
          curl -sSL -o models/ggml-tiny.en.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.en.bin
          app=desktop-app/build/compose/binaries/main-release/app/ReadAlong/bin/ReadAlong
          "$app" --self-test "smoke/Test Book" --model models/ggml-tiny.en.bin --device cpu --expect fox --out ci-results/self-test-cpu.txt || true
          cat ci-results/self-test-cpu.txt
          grep -q "^PASS" ci-results/self-test-cpu.txt

      - name: Speech test inside the installed Flatpak (CPU)
        run: |
          set -o pipefail
          flatpak run --env=READALONG_VERBOSE=1 "$APP_ID" --self-test "$PWD/smoke/Test Book" --model "$PWD/models/ggml-tiny.en.bin" --device cpu --expect fox \
            --out "$PWD/ci-results/self-test-flatpak.txt" || true
          cat ci-results/self-test-flatpak.txt
          grep -q "^PASS" ci-results/self-test-flatpak.txt

      # The same files GitHub Pages will serve, from a local web server: install through the .flatpakref, check the
      # signature, and update.
      - name: Install from the Flatpak repository
        run: |
          set -o pipefail
          flatpak uninstall --user -y --noninteractive "$APP_ID" 2>&1 | tail -2
          (cd flatpak-site && python3 -m http.server 8765 > /dev/null 2>&1 &)
          sleep 2
          sed "s|^Url=.*|Url=http://localhost:8765/repo|" flatpak-site/ReadAlong.flatpakref > ../local.flatpakref
          flatpak install --user -y --noninteractive --from ../local.flatpakref 2>&1 | tail -5 | tee ci-results/flatpak-repo.log
          flatpak remotes --user --show-details | tee -a ci-results/flatpak-repo.log
          test "$(flatpak info --user --show-origin "$APP_ID")" = readalong
          flatpak remote-ls --user readalong | tee -a ci-results/flatpak-repo.log | grep -q "$APP_ID"
          flatpak update --user -y --noninteractive 2>&1 | tail -3 | tee -a ci-results/flatpak-repo.log

      - name: Keep the Flatpak repository for GitHub Pages
        if: inputs.release
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-site
          path: flatpak-site
          include-hidden-files: true
          compression-level: 0

      - name: Speech test on the GPU path (Mesa's software Vulkan driver)
        continue-on-error: true
        run: |
          set -o pipefail
          # ggml-vulkan skips CPU-type Vulkan devices (lavapipe) unless they are listed explicitly.
          export VK_DRIVER_FILES=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -1)
          export GGML_VK_VISIBLE_DEVICES=0
          export READALONG_VERBOSE=1
          app=desktop-app/build/compose/binaries/main-release/app/ReadAlong/bin/ReadAlong
          "$app" --self-test "smoke/Test Book" --model models/ggml-tiny.en.bin --device gpu --expect fox --out ci-results/self-test-gpu.txt || true
          cat ci-results/self-test-gpu.txt
          grep -q "^PASS" ci-results/self-test-gpu.txt

      - name: Screenshots (packaged app)
        if: always()
        continue-on-error: true
        run: |
          app=desktop-app/build/compose/binaries/main-release/app/ReadAlong/bin/ReadAlong
          "$app" --screenshots "$PWD/ci-results/screenshots-linux" || true
          ls ci-results/screenshots-linux || true

      - uses: actions/upload-artifact@v4
        with:
          name: ReadAlong-Linux
          path: dist/*
          compression-level: 0

      - name: Add the Flatpak to the release
        if: inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          (cd dist && for f in ReadAlong-Linux.flatpak ReadAlong-Linux-x86_64.tar.gz; do sha256sum "$f" > "$f.sha256"; done)
          gh release upload "v$version" dist/ReadAlong-Linux.flatpak dist/ReadAlong.flatpakref dist/ReadAlong-Linux-x86_64.tar.gz dist/*.sha256 --clobber

      - name: Keep the results
        if: always()
        uses: ./.github/actions/ci-results
        with:
          job: linux-flatpak
