name: Desktop app

# Builds ReadAlong Desktop for Windows, macOS (Apple Silicon) and Linux, transcribes a short
# synthesized speech clip with each build, and checks the .readalong file like the phone does.
# Run it by hand with "publish" ticked to attach the downloads to a desktop-v<version> release.
on:
  push:
    paths: ["desktop/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a desktop-v<version> release with the downloads"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: ReadAlong-Desktop-Windows
          - os: macos-14
            artifact: ReadAlong-Desktop-macOS-AppleSilicon
          - os: ubuntu-22.04
            artifact: ReadAlong-Desktop-Linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller==6.16.0 pytest pillow
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get update -q && sudo apt-get install -y -q ffmpeg espeak-ng python3-tk mesa-vulkan-drivers; fi
          if [ "$RUNNER_OS" = "macOS" ]; then brew install ffmpeg; fi
          if [ "$RUNNER_OS" = "Windows" ]; then choco install ffmpeg -y --no-progress; fi

      - name: Unit tests
        run: python -m pytest -q tests

      # whisper.cpp built with Vulkan runs on AMD, Intel and NVIDIA cards. Static, without OpenMP, so it
      # needs nothing on the user's computer but the Vulkan loader that comes with every graphics driver.
      - name: Vulkan SDK
        if: runner.os != 'macOS'
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: 1.4.309.0
          install_runtime: true
          cache: true
          stripdown: true

      - name: Build whisper.cpp with Vulkan
        if: runner.os != 'macOS'
        run: |
          git clone -q --depth 1 --branch v1.7.6 https://github.com/ggml-org/whisper.cpp ../whisper.cpp
          cmake -S ../whisper.cpp -B ../whisper.cpp/build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
            -DGGML_VULKAN=ON -DGGML_NATIVE=OFF -DGGML_OPENMP=OFF -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_SERVER=OFF \
            -DCMAKE_POLICY_DEFAULT_CMP0091=NEW -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          cmake --build ../whisper.cpp/build --config Release -j 4 --target whisper-cli
          mkdir -p whisper-bin
          find ../whisper.cpp/build -type f \( -name whisper-cli -o -name whisper-cli.exe \) -exec cp {} whisper-bin/ \;
          # vkprobe lists the GPUs. It runs outside the bundled Python, where drivers newer than the bundle can load.
          cmake -S vkprobe -B ../vkprobe-build -DCMAKE_BUILD_TYPE=Release
          cmake --build ../vkprobe-build --config Release
          find ../vkprobe-build -type f \( -name vkprobe -o -name vkprobe.exe \) -exec cp {} whisper-bin/ \;
          ls -la whisper-bin
          whisper-bin/whisper-cli* -h > /dev/null 2>&1 && echo "whisper-cli starts"

      - name: Build
        run: |
          common=(--noconfirm --clean --collect-data faster_whisper --collect-binaries ctranslate2
                  --collect-binaries onnxruntime --hidden-import tkinter --name "ReadAlong Desktop"
                  --add-data "readalong_desktop/icon.png:readalong_desktop")
          case "$RUNNER_OS" in
            macOS) pyinstaller "${common[@]}" --icon readalong_desktop/icon.png --windowed --osx-bundle-identifier com.readalong.desktop \
                     --collect-all mlx --collect-all mlx_whisper \
                     --collect-submodules scipy._external --collect-submodules scipy._lib --collect-submodules scipy.signal run.py ;;
            *) # The nvidia-* wheels are namespace packages PyInstaller won't collect by name; add their library folders.
               mapfile -t nvidia < <(python -c "
          import os, nvidia
          root = list(nvidia.__path__)[0]
          for package in ('cuda_runtime', 'cublas', 'cudnn'):
              for sub in ('bin', 'lib'):
                  folder = os.path.join(root, package, sub)
                  if os.path.isdir(folder):
                      print('--add-binary'); print(folder + os.pathsep + 'nvidia/' + package + '/' + sub)
          " | tr -d '\r')
               test ${#nvidia[@]} -gt 0
               # whisper-cli goes in as data so PyInstaller doesn't bundle its Vulkan loader over the driver's.
               whisper=(--add-data "$(ls whisper-bin/whisper-cli*):whisper" --add-data "$(ls whisper-bin/vkprobe*):whisper")
               icon=(); [ "$RUNNER_OS" = "Windows" ] && icon=(--icon icon.ico)
               pyinstaller "${common[@]}" "${icon[@]}" "${nvidia[@]}" "${whisper[@]}" run.py ;;
          esac
          ls dist

      - name: Speech test with the built app
        run: |
          mkdir -p "smoke/Test Book"
          text="The quick brown fox jumps over the lazy dog. ReadAlong turns audiobooks into text you can read while you listen."
          case "$RUNNER_OS" in
            Linux) espeak-ng -s 140 -w "smoke/Test Book/speech.wav" "$text $text $text" ;;
            macOS) say --file-format=WAVE --data-format=LEI16@22050 -o "smoke/Test Book/speech.wav" "$text $text $text" ;;
            Windows) powershell -Command "Add-Type -AssemblyName System.Speech; \$s = New-Object System.Speech.Synthesis.SpeechSynthesizer; \$s.SetOutputToWaveFile('smoke\\Test Book\\speech.wav'); \$s.Speak('$text $text $text'); \$s.Dispose()" ;;
          esac
          case "$RUNNER_OS" in
            macOS) app="dist/ReadAlong Desktop.app/Contents/MacOS/ReadAlong Desktop" ;;
            Windows) app="dist/ReadAlong Desktop/ReadAlong Desktop.exe" ;;
            *) app="dist/ReadAlong Desktop/ReadAlong Desktop" ;;
          esac
          "$app" --version
          "$app" --check
          "$app" --list-models "smoke/Test Book"
          "$app" --model tiny --device cpu --yes "smoke/Test Book"
          python tests/check_output.py "smoke/Test Book/Test Book.readalong" "smoke/Test Book" fox

      - name: Vulkan test with the built app (software Vulkan, since the runner has no GPU)
        if: runner.os == 'Linux'
        env:
          GGML_VK_VISIBLE_DEVICES: "0"
        run: |
          rm -f "smoke/Test Book/Test Book.readalong"
          app="dist/ReadAlong Desktop/ReadAlong Desktop"
          "$app" --model tiny --device vulkan --yes "smoke/Test Book" 2>&1 | tee vulkan.log
          grep -q "GPU (Vulkan)" vulkan.log
          if grep -q "Couldn't use the GPU" vulkan.log; then exit 1; fi
          python tests/check_output.py "smoke/Test Book/Test Book.readalong" "smoke/Test Book" fox | tee check.log
          grep -q "desktop:whisper.cpp:tiny" check.log

      - name: GPU detection on a distribution newer than the build (Fedora, like Bazzite)
        if: runner.os == 'Linux'
        run: |
          docker run --rm -v "$PWD/dist:/app" fedora:42 bash -c '
            dnf -y -q install mesa-vulkan-drivers vulkan-loader > /dev/null
            "/app/ReadAlong Desktop/ReadAlong Desktop" --gpu-info --device vulkan' | tee fedora.log
          grep -q "Using: GPU (Vulkan): llvmpipe" fedora.log

      - name: Apple GPU test (runner GPUs are virtual, so this may not run)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          rm -f "smoke/Test Book/Test Book.readalong"
          "dist/ReadAlong Desktop.app/Contents/MacOS/ReadAlong Desktop" --model tiny --device metal --yes "smoke/Test Book"
          python tests/check_output.py "smoke/Test Book/Test Book.readalong" "smoke/Test Book" fox

      - name: Package
        run: |
          cd dist
          case "$RUNNER_OS" in
            macOS) ditto -c -k --keepParent "ReadAlong Desktop.app" "../${{ matrix.artifact }}.zip" ;;
            Windows) 7z a -tzip -mx=5 "../${{ matrix.artifact }}.zip" "ReadAlong Desktop" > /dev/null ;;
            *) tar -czf "../${{ matrix.artifact }}.tar.gz" "ReadAlong Desktop" ;;
          esac
          ls -la ..

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: desktop/${{ matrix.artifact }}.*
          compression-level: 0

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: downloads
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 -c "import re;print(re.search(r'\"(.+)\"', open('desktop/readalong_desktop/__init__.py').read()).group(1))")
          ls -la downloads
          # Never marked latest: the latest release stays the Android app.
          gh release create "desktop-v$version" downloads/* --target "$GITHUB_SHA" --latest=false \
            --title "ReadAlong Desktop $version" --notes-file desktop/RELEASE_NOTES.md
