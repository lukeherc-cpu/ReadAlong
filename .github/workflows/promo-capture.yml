name: Promo capture (emulator)

# Captures the demo-book screens for promo material (PromoCaptureTest) on an emulator, and records the run.
# The pictures are pushed to the promo/footage branch. Runs on pushes to promo/capture only.
on:
  push:
    branches: ["promo/capture"]

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - uses: gradle/actions/setup-gradle@v4

      - name: Build app and tests
        run: ./gradlew --no-configuration-cache assembleGithubDebug assembleGithubDebugAndroidTest

      - name: Fetch covers
        run: |
          pip install pillow >/dev/null
          mkdir -p promo-in/covers && python3 tools/promo/covers.py promo-in

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb install -r -g app/build/outputs/apk/github/debug/app-github-debug.apk
            adb install -r -g app/build/outputs/apk/androidTest/github/debug/app-github-debug-androidTest.apk
            adb shell mkdir -p /sdcard/Download/readalong-promo/covers
            adb push promo-in/covers/. /sdcard/Download/readalong-promo/covers/
            adb push promo-in/titles.txt /sdcard/Download/readalong-promo/titles.txt
            adb shell settings put system screen_off_timeout 1800000
            # A busy emulator's launcher throws "isn't responding" dialogs over the app; it isn't needed here.
            adb shell settings put global anr_show_background 0 || true
            adb shell pm disable-user --user 0 com.google.android.apps.nexuslauncher || true
            sleep 45
            adb shell "cmd overlay enable com.android.internal.systemui.navbar.gestural" || true
            adb shell "settings put global sysui_demo_allowed 1; am broadcast -a com.android.systemui.demo -e command enter; am broadcast -a com.android.systemui.demo -e command clock -e hhmm 0941; am broadcast -a com.android.systemui.demo -e command battery -e level 100 -e plugged false; am broadcast -a com.android.systemui.demo -e command network -e wifi show -e level 4; am broadcast -a com.android.systemui.demo -e command notifications -e visible false" || true
            (adb shell screenrecord --bit-rate 20000000 --time-limit 180 /sdcard/Download/promo-run.mp4 &) ; sleep 2
            adb shell am instrument -w -r -e promo true -e class com.example.readalong.PromoCaptureTest com.example.readalong.test/androidx.test.runner.AndroidJUnitRunner | tee instrument.txt
            sleep 3; adb shell pkill -INT screenrecord || true; sleep 4
            mkdir -p out; adb pull /sdcard/Android/data/com.example.readalong/files/promo-captures/. out/ || true
            adb pull /sdcard/Download/promo-run.mp4 out/ || true
            cp instrument.txt out/
            ls -la out

      - name: Push captures to promo/footage
        if: always()
        run: |
          [ -d out ] || exit 0
          cd out
          git init -q -b promo/footage
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Promo captures from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" promo/footage
