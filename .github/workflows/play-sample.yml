name: Play sample build

# Builds the Play flavor (its own app id, io.github.lukeherc_cpu.readalong) for a private look before any Play
# listing: an APK that installs beside the GitHub app, and an app bundle for Play's internal testing track.
# Run it by hand. The files are kept for one day only, since this repository is public.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  play:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install SDK packages
        run: |
          sdkmanager="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin | sort -V | tail -1)/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew --no-configuration-cache assemblePlayRelease bundlePlayRelease

      - name: Sign
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          PLAY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
          PLAY_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEYSTORE_PASSWORD }}
          PLAY_UPLOAD_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
        run: |
          version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          # The APK is for installing by hand, signed like the GitHub builds.
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/debug.keystore"
          unsigned=$(ls app/build/outputs/apk/play/release/*.apk | head -1)
          "$tools/zipalign" -f -p 4 "$unsigned" aligned.apk
          "$tools/apksigner" sign --ks "$RUNNER_TEMP/debug.keystore" --ks-pass pass:android \
            --ks-key-alias androiddebugkey --key-pass pass:android --out "ReadAlong-Play-sample-$version.apk" aligned.apk
          # Play only takes a bundle signed with an upload key (never a debug key); without one it stays unsigned.
          bundle=$(ls app/build/outputs/bundle/playRelease/*.aab | head -1)
          if [ -n "$PLAY_UPLOAD_KEYSTORE_BASE64" ]; then
            echo "$PLAY_UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
            jarsigner -keystore "$RUNNER_TEMP/upload.keystore" -storepass "$PLAY_UPLOAD_KEYSTORE_PASSWORD" \
              -signedjar "ReadAlong-Play-$version.aab" "$bundle" "$PLAY_UPLOAD_KEY_ALIAS"
          else
            cp "$bundle" "ReadAlong-Play-$version-unsigned.aab"
          fi
          rm -f "$RUNNER_TEMP"/*.keystore
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ReadAlong-Play-sample-${{ env.VERSION }}
          path: |
            ReadAlong-Play-*.apk
            ReadAlong-Play-*.aab
          retention-days: 1
