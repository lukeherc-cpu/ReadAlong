name: Website

# Builds the landing page in website/ and publishes it to GitHub Pages, with the latest release's Flatpak repository at /flatpak/.
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
on:
  push:
    branches: [main]
    paths: ["website/**", ".github/workflows/website.yml"]
  pull_request:
    paths: ["website/**", ".github/workflows/website.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      # Gives the site's real address (it changes with a custom domain), used for canonical and preview-image URLs.
      # Pull requests only build, so they don't need Pages to be switched on.
      - id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - run: npm ci

      - run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}

      # Linux updates: the latest release's signed Flatpak repository, served at /flatpak/ (release.yml attaches it
      # and starts this workflow). A release from before the repository existed simply has none.
      - name: Add the Flatpak repository
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release download --repo "$GITHUB_REPOSITORY" --pattern ReadAlong-Linux-flatpak-repo.tar --dir "$RUNNER_TEMP"; then
            mkdir -p dist/flatpak
            tar -C dist/flatpak -xf "$RUNNER_TEMP/ReadAlong-Linux-flatpak-repo.tar"
            ls dist/flatpak
          else
            echo "The latest release has no Flatpak repository yet."
          fi

      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
